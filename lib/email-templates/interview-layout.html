<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{title}}</title>
  <!--
    Light design is fully inline (Outlook-safe). This block only improves clients
    that honour prefers-color-scheme. Do not rely on it for structure or layout.
  -->
  <style type="text/css">
    :root { color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      .dh-body { background-color: #121417 !important; }
      .dh-card { background-color: #1A1A1A !important; border-color: #2E3238 !important; }
      .dh-surface { background-color: #1A1A1A !important; }
      /* Header band stays Bice Blue in dark mode so the white logo keeps contrast. */
      .dh-header {
        background-color: #1270A0 !important;
      }
      .dh-details { background-color: #24282E !important; border-color: #2E3238 !important; }
      .dh-foot {
        background-color: #121417 !important;
        border-color: #2E3238 !important;
        color: #B0B0B0 !important;
        -webkit-text-fill-color: #B0B0B0 !important;
      }
      /* Labels = secondary (muted). Values = primary (bright). */
      .dh-label {
        color: #B0B0B0 !important;
        -webkit-text-fill-color: #B0B0B0 !important;
      }
      .dh-value,
      .dh-details .dh-value,
      td.dh-value,
      span.dh-value,
      p.dh-value {
        color: #FFFFFF !important;
        -webkit-text-fill-color: #FFFFFF !important;
      }
      .dh-text,
      .dh-text strong,
      p.dh-text {
        color: #F5F5F5 !important;
        -webkit-text-fill-color: #F5F5F5 !important;
      }
      .dh-muted {
        color: #C0C0C0 !important;
        -webkit-text-fill-color: #C0C0C0 !important;
      }
      .dh-primary,
      .dh-eyebrow,
      .dh-link,
      a.dh-link {
        color: #7EC8E8 !important;
        -webkit-text-fill-color: #7EC8E8 !important;
      }
      .dh-row-rule { border-top-color: #2E3238 !important; }
    }
  </style>
</head>
<body class="dh-body" style="margin:0;padding:0;background-color:#E2E3E4;">
<!--
  Shared interview email layout (interviewer + candidate).
  Slots: {{summary_block}} {{detail_rows}}
  Placeholders: {{title}} {{logo_url}} {{site_url}} {{eyebrow}} {{intro}} {{footer_block}}
  {{title}} is the document title; every caller passes its own subject.
  Also available: {{candidate}} {{role}} {{stage}} {{when}} {{time}} {{format}}
  {{interviewer}} {{candidate_email}} {{candidate_phone}}
-->
<table role="presentation" class="dh-body" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#E2E3E4;margin:0;padding:24px 12px;font-family:Poppins,'Segoe UI',Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" class="dh-card" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:600px;width:100%;background-color:#FFFFFF;border:1px solid #D5D6D8;">
        <!-- Logo on Bice Blue band (stays blue in dark mode) -->
        <tr>
          <td class="dh-header" bgcolor="#1270A0" style="padding:12px 24px;background-color:#1270A0;">
            <a href="{{site_url}}" style="text-decoration:none;">
              <img src="{{logo_url}}" alt="Digital Hub logo" width="48" height="48" style="display:block;border:0;outline:none;text-decoration:none;width:48px;height:48px;max-width:48px;">
            </a>
          </td>
        </tr>
        <!-- Brand accent (orange) — sits on blue, not white -->
        <tr>
          <td bgcolor="#F4970B" style="height:4px;line-height:4px;font-size:0;background-color:#F4970B;">&nbsp;</td>
        </tr>
        <!-- Eyebrow -->
        <tr>
          <td class="dh-surface" style="padding:18px 28px 0;background-color:#FFFFFF;">
            <p class="dh-eyebrow" style="margin:0;font-family:Poppins,'Segoe UI',Arial,Helvetica,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1270A0;">{{eyebrow}}</p>
          </td>
        </tr>
        <!-- Who / what / when hierarchy -->
        <tr>
          <td class="dh-surface" style="padding:10px 28px 0;background-color:#FFFFFF;">
            {{summary_block}}
          </td>
        </tr>
        <!-- Intro -->
        <tr>
          <td class="dh-surface dh-text" style="padding:18px 28px 0;background-color:#FFFFFF;font-family:Poppins,'Segoe UI',Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;color:#1A1A1A;">
            <p class="dh-text" style="margin:0;color:#1A1A1A;">{{intro}}</p>
          </td>
        </tr>
        <!-- Details -->
        <tr>
          <td class="dh-surface" style="padding:20px 28px 8px;background-color:#FFFFFF;">
            <table role="presentation" class="dh-details" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;background-color:#F7F7F8;border:1px solid #E2E3E4;">
              {{detail_rows}}
            </table>
          </td>
        </tr>
        <!-- CTA / footer copy (optional) -->
        {{footer_block}}
        <!-- Site footer -->
        <tr>
          <td class="dh-foot" style="padding:16px 28px;background-color:#E2E3E4;border-top:1px solid #D5D6D8;font-family:Poppins,'Segoe UI',Arial,Helvetica,sans-serif;font-size:11px;line-height:1.5;color:#5A5A5A;">
            Digital Hub · New Cairo, Egypt<br>
            <a class="dh-link" href="{{site_url}}" style="color:#1270A0;text-decoration:none;">digitalhub.com.eg</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
