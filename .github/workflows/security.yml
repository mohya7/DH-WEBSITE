# Security checks for the website, the Studio, and the Content API (the hiring
# application is out of scope). A separate workflow, so the four CI jobs and their
# timings are unchanged.
#
# Each job fails only on a NEW High or Critical finding (or any new secret).
# Findings that already existed are listed with an owner in
# .github/security/known-findings.json and reported as warnings; nothing is
# suppressed in the tools. .github/security/gate.mjs does the comparison.
#
# Semgrep Community Edition 1.180.0 scans the roots in SEMGREP_ROOTS (api/,
# website/src, website/scripts, website/behaviors, studio/src, and packages/)
# with the public packs p/javascript, p/typescript, p/csharp, p/owasp-top-ten,
# and p/secrets. No login and no token; metrics are off. It does not catch
# logic flaws, or bugs that only show up when a real request is made. An ERROR
# fails unless it is listed under semgrep in known-findings.json with an owner
# and a reason. To record one, append an object whose id is rule:path:line,
# plus rule, path, line, owner, and reason. A WARNING is printed as rule, file,
# and line and does not fail. INFO is validated and not printed. A partial
# parse is printed as a path and does not fail, and only when its type is the
# tagged array ["PartialParsing", locations] that Semgrep 1.180 writes for the
# C# parser's warnings on primary constructors and the top-level Program class.
# Timeout, out of memory, stack overflow, a fatal error, a rule parse error,
# any other type, and a missing or malformed type fail the job.
# The uploaded report drops matched lines and metavars, which can contain a secret.

name: Security

on:
  pull_request:
  push:
    branches: [rebuild/dotnet-platform]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: "1.180.0"
  # One list. The gate self-test reads this line and fails if a required root is missing.
  SEMGREP_ROOTS: api website/src website/scripts website/behaviors studio/src packages

jobs:
  gate-self-test:
    name: Security gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Gate self-test
        run: node --test .github/security/gate.test.mjs

  npm-audit:
    name: npm audit (${{ matrix.app }}) — High and Critical
    needs: gate-self-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [website, studio]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm audit reads package-lock.json; no install is needed.
      - name: npm audit --omit=dev --audit-level=high
        run: npm audit --omit=dev --audit-level=high || true

      - name: Fail on a new High or Critical advisory
        run: |
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/audit.json" || true
          node ../.github/security/gate.mjs npm "$RUNNER_TEMP/audit.json" ${{ matrix.app }}

  dotnet-vulnerable:
    name: NuGet vulnerable packages (api) — High and Critical
    needs: gate-self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore DigitalHub.slnx

      - name: dotnet list package --vulnerable --include-transitive
        run: dotnet list DigitalHub.slnx package --vulnerable --include-transitive

      - name: Fail on a new High or Critical advisory
        run: |
          dotnet list DigitalHub.slnx package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/dotnet.json"
          node ../.github/security/gate.mjs dotnet "$RUNNER_TEMP/dotnet.json"

  gitleaks-pr:
    name: Secret scan (gitleaks, this pull request's commits)
    needs: gate-self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the commits of this pull request (values redacted)
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 0 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-pr.json" .
          node .github/security/gate.mjs gitleaks "$RUNNER_TEMP/gitleaks-pr.json" pr-diff

  gitleaks-history:
    name: Secret scan (gitleaks, full history)
    needs: gate-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit on every branch (values redacted)
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 0 \
            --log-opts="--all" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json" .
          node .github/security/gate.mjs gitleaks "$RUNNER_TEMP/gitleaks-history.json" full-history

      - name: Upload the redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-redacted
          path: ${{ runner.temp }}/gitleaks-history.json
          if-no-files-found: warn

  semgrep:
    name: Semgrep (ERROR fails, WARNING reported)
    needs: gate-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Semgrep ${{ env.SEMGREP_VERSION }}
        run: pip install "semgrep==${SEMGREP_VERSION}"

      # Scanned: the directories in SEMGREP_ROOTS. api/ includes api/tests.
      # website/behaviors is copied into the public site by website/scripts/prepare-design.ts.
      # .semgrepignore replaces Semgrep's built-in ignore, which skips directories
      # named tests and would otherwise hide api/tests.
      # Excluded, and why:
      #   node_modules, bin, obj, dist, out — dependencies and build output
      #   website/design — locked stylesheets, not code we change
      #   website/fixtures — snapshot content and settings fixtures, not application code
      #   *.Designer.cs and *ModelSnapshot.cs — Entity Framework generated files.
      #     A pattern with a slash did not match Windows paths, and a trailing /**
      #     exclude makes semgrep-core fail to list targets. "generated" is the
      #     directory name excluded for schema types from npm run gen:types.
      # studio/e2e is outside studio/src, so its pixel fixture is not scanned.
      - name: Scan
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set +e
          semgrep scan \
            --metrics=off \
            --disable-version-check \
            --quiet \
            --json \
            --output "$RUNNER_TEMP/semgrep.json" \
            --config p/javascript \
            --config p/typescript \
            --config p/csharp \
            --config p/owasp-top-ten \
            --config p/secrets \
            --exclude node_modules \
            --exclude bin \
            --exclude obj \
            --exclude dist \
            --exclude out \
            --exclude website/design \
            --exclude website/fixtures \
            --exclude "*.Designer.cs" \
            --exclude "*ModelSnapshot.cs" \
            --exclude generated \
            $SEMGREP_ROOTS
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "semgrep exited $code"
            exit "$code"
          fi
          node .github/security/gate.mjs semgrep "$RUNNER_TEMP/semgrep.json"

      - name: Redact matched source before upload
        if: always()
        env:
          SEMGREP_REPORT: ${{ runner.temp }}/semgrep.json
          SEMGREP_REDACTED: ${{ runner.temp }}/semgrep-redacted.json
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.env.SEMGREP_REPORT, "utf8"));
            if (Array.isArray(report.results)) {
              for (const result of report.results) {
                const severity = result && result.extra && typeof result.extra.severity === "string" ? result.extra.severity : "";
                if (result && typeof result === "object") result.extra = { severity };
              }
            }
            if (Array.isArray(report.errors)) report.errors = report.errors.map(() => ({ type: "redacted" }));
            writeFileSync(process.env.SEMGREP_REDACTED, JSON.stringify(report));
          '

      - name: Upload the redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-redacted
          path: ${{ runner.temp }}/semgrep-redacted.json
          if-no-files-found: warn
