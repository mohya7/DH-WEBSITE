# Continuous integration for the platform rebuild.
#
# The local machine can no longer run .NET builds (Windows Application Control
# blocks freshly built binaries), so .NET verification runs here. Each area is
# its own job, so a failure shows exactly where.
#
# Every credential in this file is a workflow-only value for a throwaway SQL
# Server container that exists for one job. None is a real secret, and none is
# read from user-secrets or repository secrets.

name: CI

on:
  pull_request:
    # labeled: adding the "screenshots" label runs the optional screenshot job (and, with it, the rest of CI).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [rebuild/dotnet-platform]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NODE_VERSION: "22"
  # Workflow-only SQL Server credentials. The container is created for one job and discarded.
  SA_PASSWORD: CiOnlySa2026Passw0rd
  APP_LOGIN: dh_content_app
  APP_PASSWORD: CiOnlyApp2026Passw0rd

# Every job runs on ubuntu-24.04, not ubuntu-latest. ubuntu-latest moved to Ubuntu 26.04,
# where Playwright 1.56.1 cannot install its browsers, so the end-to-end and comparison jobs fail.
# Moving to a newer image means upgrading Playwright and re-baselining the screenshots in the
# same change.
jobs:
  api:
    name: API — Release build, migrations, integration tests
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Same workflow-only value as SA_PASSWORD above; the env context is not available here.
          MSSQL_SA_PASSWORD: CiOnlySa2026Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnlySa2026Passw0rd -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    env:
      # What the integration tests read in place of user-secrets. Both name
      # DigitalHubContent and the tests rewrite them to DigitalHubContent_Test.
      # The tests themselves use the restricted login; only AuditRollbackTests
      # uses the administrator connection, to create and drop a trigger.
      ConnectionStrings__Content: Server=localhost,1433;Database=DigitalHubContent;User ID=dh_content_app;Password=CiOnlyApp2026Passw0rd;Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__ContentAdmin: Server=localhost,1433;Database=DigitalHubContent;User ID=sa;Password=CiOnlySa2026Passw0rd;Encrypt=True;TrustServerCertificate=True
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools (dotnet-ef)
        run: dotnet tool restore

      - name: Build (Release)
        run: dotnet build DigitalHub.slnx -c Release

      - name: Create the test database and the restricted login
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "
              CREATE DATABASE [DigitalHubContent_Test];
              CREATE LOGIN [$APP_LOGIN] WITH PASSWORD = N'$APP_PASSWORD', CHECK_POLICY = OFF;"

      - name: Apply migrations to the fresh database (dotnet-ef, administrator login)
        run: >-
          dotnet tool run dotnet-ef -- database update
          --no-build --configuration Release
          --project src/DigitalHub.Api/DigitalHub.Api.csproj
          --connection "Server=localhost,1433;Database=DigitalHubContent_Test;User ID=sa;Password=$SA_PASSWORD;Encrypt=True;TrustServerCertificate=True"

      - name: Migration checks — idempotent script twice, previous schema
        # New gate (ENGINEERING_STANDARDS.md section 3): reports until
        # MIGRATION_CHECKS_BLOCKING_FROM, then blocks. The canary always blocks.
        env:
          MIGRATION_CHECKS_BLOCKING_FROM: "2026-11-18"
          BASE_REF: ${{ github.base_ref || 'rebuild/dotnet-platform' }}
        run: tools/migration-checks/run.sh "${{ job.services.mssql.id }}"

      - name: Grant the restricted login read and write, and nothing else
        # The audit log is append-only for the application login (finding L6).
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b -d DigitalHubContent_Test -Q "
              CREATE USER [$APP_LOGIN] FOR LOGIN [$APP_LOGIN];
              ALTER ROLE db_datareader ADD MEMBER [$APP_LOGIN];
              ALTER ROLE db_datawriter ADD MEMBER [$APP_LOGIN];
              DENY UPDATE, DELETE ON dbo.audit_log TO [$APP_LOGIN];"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      - name: Integration tests (Release)
        run: >-
          dotnet test tests/DigitalHub.Api.Tests/DigitalHub.Api.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=api-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory ${{ github.workspace }}/reports/api

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api
          if-no-files-found: warn

  website:
    name: Website — typecheck, tests, design check, snapshot build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feature/interviewer-portal for the design check
        working-directory: .
        run: git fetch --no-tags --depth=1 origin feature/interviewer-portal:refs/remotes/origin/feature/interviewer-portal

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: >-
          npx vitest run
          --reporter=default --reporter=junit
          --outputFile.junit=${{ github.workspace }}/reports/website/vitest-junit.xml

      - name: Design check against feature/interviewer-portal
        run: npm run design:check

      - name: Snapshot build
        env:
          CONTENT_SOURCE: snapshot
          # Section 6: canonical URLs and the sitemap. The build refuses to run without it.
          PUBLIC_SITE_URL: https://digitalhub.com.eg
        run: npm run build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-report
          path: reports/website
          if-no-files-found: warn

      - name: Upload the built site for the section comparison
        uses: actions/upload-artifact@v4
        with:
          name: website-out
          path: website/out
          if-no-files-found: error

  studio:
    name: Studio — typecheck, build, end-to-end
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnlySa2026Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnlySa2026Passw0rd -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    env:
      # The end-to-end run uses its own database, DigitalHubContent_E2e, which
      # the harness derives from these and drops, recreates, migrates, and grants
      # itself: with the administrator connection over SQL authentication here,
      # with Windows authentication locally.
      ConnectionStrings__Content: Server=localhost,1433;Database=DigitalHubContent;User ID=dh_content_app;Password=CiOnlyApp2026Passw0rd;Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__ContentAdmin: Server=localhost,1433;Database=DigitalHubContent;User ID=sa;Password=CiOnlySa2026Passw0rd;Encrypt=True;TrustServerCertificate=True
      # Workflow-only token signing key for the end-to-end API; locally it comes from user-secrets.
      Auth__SigningKey: ci-only-signing-key-not-a-secret-0123456789abcdef
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Build (fails if the preview's design files differ from website/design/)
        env:
          # Required, with no default (Phase C, 9.2). This build is not deployed;
          # each deployment sets its own website address.
          VITE_PUBLIC_SITE_URL: https://website.ci.invalid
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Create the restricted login for the end-to-end API
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "
              CREATE LOGIN [$APP_LOGIN] WITH PASSWORD = N'$APP_PASSWORD', CHECK_POLICY = OFF;"

      - name: Put mssql-tools18 sqlcmd first on the path for the end-to-end harness
        # The harness calls sqlcmd with -C (trust the container's certificate), as
        # mssql-tools18 does locally. Use that version, whatever else the runner has.
        run: |
          if [ ! -x /opt/mssql-tools18/bin/sqlcmd ]; then
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          fi
          echo /opt/mssql-tools18/bin >> "$GITHUB_PATH"
          /opt/mssql-tools18/bin/sqlcmd -? | head -n 3

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/reports/studio/playwright-report
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/studio/e2e-junit.xml
        run: npx playwright test --reporter=list,html,junit

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-report
          path: |
            reports/studio
            studio/test-results
          if-no-files-found: warn

  section-compare:
    name: Section comparison against feature/interviewer-portal
    runs-on: ubuntu-24.04
    needs: website
    # Non-blocking until Section 5 has merged. This branch's comparison is the
    # website's current section tool. When Section 5 is on
    # rebuild/dotnet-platform, remove continue-on-error from the compare step
    # so a difference that is not in
    # website/tools/section-compare/accepted-differences.json fails the workflow.
    steps:
      - uses: actions/checkout@v4

      - name: Check out feature/interviewer-portal (read-only)
        uses: actions/checkout@v4
        with:
          ref: feature/interviewer-portal
          path: old-site
          persist-credentials: false

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: website-out
          path: website/out

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install the website tool and Chromium
        working-directory: website
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Compare sections
        continue-on-error: true
        working-directory: website
        env:
          SECTION_COMPARE_OLD: ${{ github.workspace }}/old-site
          SECTION_COMPARE_NEW: ${{ github.workspace }}/website/out
          SECTION_COMPARE_PORT: "4390"
          SECTION_COMPARE_OUT: ${{ github.workspace }}/reports/section-compare
        run: npm run compare:sections

      - name: Write the comparison to the job summary
        if: always()
        run: |
          report="${{ github.workspace }}/reports/section-compare/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The section comparison did not write a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the comparison output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-compare
          path: reports/section-compare
          if-no-files-found: warn

  screenshot-parity:
    name: Screenshot parity (optional, label "screenshots")
    runs-on: ubuntu-24.04
    needs: website
    # Optional and manual: runs only on a pull request labelled "screenshots".
    # The comparison does not fail the workflow while the screenshot register waits
    # for its first approved entries. The Chromium regression tests do fail the job.
    # Chromium, Firefox, and WebKit; WebKit cannot run on the Windows development
    # machines (Application Control). See website/README.md.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'screenshots')
    steps:
      - uses: actions/checkout@v4

      - name: Check out feature/interviewer-portal (read-only)
        uses: actions/checkout@v4
        with:
          ref: feature/interviewer-portal
          path: old-site
          persist-credentials: false

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: website-out
          path: website/out

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install the website tool and the three browsers
        working-directory: website
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Chromium regression tests
        working-directory: website
        run: |
          npx vitest run test/screenshot-parity-browser.test.ts --reporter=default --reporter=json --outputFile.json="${RUNNER_TEMP}/screenshot-browser.json"
          node tools/check-browser-test-report.mjs "${RUNNER_TEMP}/screenshot-browser.json" 30

      - name: Compare screenshots
        continue-on-error: true
        working-directory: website
        env:
          SCREENSHOT_OLD_ROOT: ${{ github.workspace }}/old-site
          SCREENSHOT_NEW_ROOT: ${{ github.workspace }}/website/out
          SCREENSHOT_BROWSERS: chromium,firefox,webkit
          SCREENSHOT_PORT: "4392"
          SCREENSHOT_CANDIDATE_PORT: "4393"
          SCREENSHOT_OUT: ${{ github.workspace }}/reports/screenshot-parity
        run: npm run compare:screenshots

      - name: Upload the screenshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-parity
          path: reports/screenshot-parity
          if-no-files-found: warn

  website-browser:
    name: Website — browser tests, default and consent builds
    runs-on: ubuntu-24.04
    # The 29 Playwright tests in website/browser-tests, each in the build it targets:
    # pages.spec.ts in both builds, consent.spec.ts only in the consent build
    # (SNAPSHOT_SETTINGS_FIXTURE=consent). Playwright exits 0 when tests skip, so
    # tools/browser-suite/check-report.mjs reads both reports against
    # tools/browser-suite/expected.json. A test that does not run as expected fails
    # the job at once; a failed test is a warning until BROWSER_TESTS_BLOCKING_FROM
    # (UTC) and fails the job from that date. Runner pinned to ubuntu-24.04 because
    # Playwright 1.56.1 cannot install its browsers on ubuntu-latest (26.04).
    env:
      BROWSER_TESTS_BLOCKING_FROM: "2026-11-18"
      CONTENT_SOURCE: snapshot
      PUBLIC_SITE_URL: https://digitalhub.com.eg
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Canary — the check must reject its committed bad reports
        run: node tools/browser-suite/run-canary.mjs

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Default build
        run: npm run build

      - name: Browser tests, default build
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/reports/website-browser/default.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/reports/website-browser/default-html
        run: |
          status=0
          npx playwright test --reporter=list,json,html --output "${{ github.workspace }}/reports/website-browser/default-results" || status=$?
          echo "Playwright exit ${status}"
          # 1 is failed tests, which the check step judges; any other code means the run itself broke.
          if [ "${status}" -gt 1 ]; then exit "${status}"; fi

      - name: Consent build
        env:
          SNAPSHOT_SETTINGS_FIXTURE: consent
        run: |
          rm -rf out
          npm run build

      - name: Browser tests, consent build
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/reports/website-browser/consent.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/reports/website-browser/consent-html
        run: |
          status=0
          npx playwright test --reporter=list,json,html --output "${{ github.workspace }}/reports/website-browser/consent-results" || status=$?
          echo "Playwright exit ${status}"
          # 1 is failed tests, which the check step judges; any other code means the run itself broke.
          if [ "${status}" -gt 1 ]; then exit "${status}"; fi

      - name: Check both runs
        env:
          REPORTS: ${{ github.workspace }}/reports/website-browser
        run: node tools/browser-suite/check-report.mjs tools/browser-suite/expected.json "default=${REPORTS}/default.json" "consent=${REPORTS}/consent.json"

      - name: Upload the browser test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-browser-report
          path: reports/website-browser
          if-no-files-found: warn
