  semgrep:
    name: Semgrep (ERROR fails, WARNING reported)
    needs: gate-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Semgrep 1.180.0
        run: pip install "semgrep==1.180.0"

      - name: Scan
        run: bash .github/security/run-semgrep.sh

      - name: Redact matched source before upload
        run: node .github/security/redact-report.mjs "$RUNNER_TEMP/semgrep.json" "$RUNNER_TEMP/semgrep-redacted.json"

      - name: Upload the redacted report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-redacted
          path: ${{ runner.temp }}/semgrep-redacted.json
          if-no-files-found: warn
